      - name: Upload Manifest Artifact for State Comparison
        uses: actions/upload-artifact@v4
        with:
          name: prod-manifest
          path: target/manifest.json

  deploy-prod:
    name: "Deploy -> PROD"
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - uses: snowflakedb/snowflake-actions@v3
        with:
          cli-version: "latest"

      - run: |
          printf '%s' "${{ secrets.SNOWFLAKE_PRIVATE_KEY_PROD }}" | tr -d '\r' > /tmp/sf_key.p8
