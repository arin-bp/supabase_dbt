          SNOWFLAKE_WAREHOUSE: "SUPABASE_PROD_WH"
          SNOWFLAKE_DATABASE: "SUPABASE_PROD"
          SNOWFLAKE_SOURCE_DATABASE: "SUPABASE_PROD"
          SNOWFLAKE_PRIVATE_KEY_PATH: "/tmp/sf_key.p8"
        run: |
