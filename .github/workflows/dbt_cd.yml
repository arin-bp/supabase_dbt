          SNOWFLAKE_USER: "SVC_DBT_UAT"
          SNOWFLAKE_ROLE: "DBT_UAT_ROLE"
          SNOWFLAKE_WAREHOUSE: "SUPABASE_UAT_WH"
          SNOWFLAKE_DATABASE: "SUPABASE_UAT"
          SNOWFLAKE_SOURCE_DATABASE: "SUPABASE_UAT"
          SNOWFLAKE_PRIVATE_KEY_PATH: "/tmp/sf_key.p8"
        run: |
          pip install dbt-snowflake==1.9.0
          dbt deps
