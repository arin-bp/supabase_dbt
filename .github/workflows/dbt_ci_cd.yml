name: dbt CI/CD — Snowflake Native

on:
  push:
    branches: [dev, sit, uat, main]
  pull_request:
    branches: [dev, sit, uat, main]

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

# ──────────────────────────────────────────────────────────────
# Reusable key-write script (DRY — defined once, used in all jobs)
# Written as an env var to avoid repeating 200 lines.
# This Python script:
#   1. Reads the secret from env var (bypasses shell interpretation)
#   2. Auto-detects raw PEM vs base64-encoded PEM
#   3. Normalises line endings (strips \r)
#   4. Validates with cryptography library — FAILS FAST if key is bad
#   5. Writes to /tmp/sf_key.p8 with chmod 600
# ──────────────────────────────────────────────────────────────
env:
  WRITE_AND_VALIDATE_KEY: |
    import os, base64, stat
    from cryptography.hazmat.primitives.serialization import load_pem_private_key

    raw = os.environ['SNOWFLAKE_PRIVATE_KEY'].strip()

    # Auto-detect: raw PEM starts with "-----", base64 does not
    if raw.startswith('-----'):
        pem_bytes = (raw + '\n').encode()
        print('Secret format: raw PEM  ✓')
    else:
        pem_bytes = base64.b64decode(raw)
        print('Secret format: base64-encoded PEM  ✓')

    # Normalise line endings (strip \r if any)
    pem_bytes = pem_bytes.replace(b'\r\n', b'\n').replace(b'\r', b'\n')

    # TDD: validate before writing — fail fast with clear message
    try:
        key = load_pem_private_key(pem_bytes, password=None)
        print(f'Key validation: PASS — {type(key).__name__} {key.key_size}-bit  ✓')
    except Exception as e:
        print(f'Key validation: FAIL — {e}')
        raise SystemExit(1)

    with open('/tmp/sf_key.p8', 'wb') as f:
        f.write(pem_bytes)
    os.chmod('/tmp/sf_key.p8', stat.S_IRUSR | stat.S_IWUSR)
    print('Written: /tmp/sf_key.p8  ✓')

jobs:
  # ──────────────────────────────────────────────────────────────
  # PR VALIDATION
  # ──────────────────────────────────────────────────────────────
  pr-validate:
    name: "PR Validation — dbt compile"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Snowflake CLI
        run: pip install snowflake-cli cryptography

      - name: Write + validate private key
        env:
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_DEV }}
        run: python - <<< "$WRITE_AND_VALIDATE_KEY"

      - name: Deploy ephemeral CI project
        run: |
          snow dbt deploy supabase_ci_pr_${{ github.run_id }} \
            --source . \
            --default-target dev \
            --dbt-version 1.9.0 \
            --env-file-dir . \
            --temporary-connection \
            --account "${{ secrets.SNOWFLAKE_ACCOUNT }}" \
            --user "${{ secrets.SNOWFLAKE_SVC_USER_DEV }}" \
            --authenticator SNOWFLAKE_JWT \
            --private-key-file /tmp/sf_key.p8 \
            --role DBT_DEV_ROLE \
            --warehouse SUPABASE_DEV_WH \
            --database SUPABASE_DEV

      - name: dbt compile
        run: |
          snow dbt execute supabase_ci_pr_${{ github.run_id }} \
            --command "dbt compile --target dev" \
            --temporary-connection \
            --account "${{ secrets.SNOWFLAKE_ACCOUNT }}" \
            --user "${{ secrets.SNOWFLAKE_SVC_USER_DEV }}" \
            --authenticator SNOWFLAKE_JWT \
            --private-key-file /tmp/sf_key.p8 \
            --role DBT_DEV_ROLE \
            --warehouse SUPABASE_DEV_WH \
            --database SUPABASE_DEV

      - name: Cleanup ephemeral project
        if: always()
        run: |
          snow dbt drop supabase_ci_pr_${{ github.run_id }} \
            --temporary-connection \
            --account "${{ secrets.SNOWFLAKE_ACCOUNT }}" \
            --user "${{ secrets.SNOWFLAKE_SVC_USER_DEV }}" \
            --authenticator SNOWFLAKE_JWT \
            --private-key-file /tmp/sf_key.p8 \
            --role DBT_DEV_ROLE \
            --warehouse SUPABASE_DEV_WH \
            --database SUPABASE_DEV || true

  # ──────────────────────────────────────────────────────────────
  # DEPLOY TO DEV
  # ──────────────────────────────────────────────────────────────
  deploy-dev:
    name: "Deploy → DEV"
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Snowflake CLI
        run: pip install snowflake-cli cryptography

      - name: Write + validate private key
        env:
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_DEV }}
        run: python - <<< "$WRITE_AND_VALIDATE_KEY"

      - name: Deploy to DEV
        run: |
          snow dbt deploy supabase_dev \
            --source . \
            --default-target dev \
            --dbt-version 1.9.0 \
            --env-file-dir . \
            --temporary-connection \
            --account "${{ secrets.SNOWFLAKE_ACCOUNT }}" \
            --user "${{ secrets.SNOWFLAKE_SVC_USER_DEV }}" \
            --authenticator SNOWFLAKE_JWT \
            --private-key-file /tmp/sf_key.p8 \
            --role DBT_DEV_ROLE \
            --warehouse SUPABASE_DEV_WH \
            --database SUPABASE_DEV

      - name: Report deployed version
        run: |
          snow dbt describe supabase_dev \
            --temporary-connection \
            --account "${{ secrets.SNOWFLAKE_ACCOUNT }}" \
            --user "${{ secrets.SNOWFLAKE_SVC_USER_DEV }}" \
            --authenticator SNOWFLAKE_JWT \
            --private-key-file /tmp/sf_key.p8 \
            --role DBT_DEV_ROLE \
            --warehouse SUPABASE_DEV_WH \
            --database SUPABASE_DEV

  # ──────────────────────────────────────────────────────────────
  # DEPLOY TO SIT
  # ──────────────────────────────────────────────────────────────
  deploy-sit:
    name: "Deploy → SIT"
    if: github.event_name == 'push' && github.ref == 'refs/heads/sit'
    runs-on: ubuntu-latest
    environment: sit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Snowflake CLI
        run: pip install snowflake-cli cryptography

      - name: Write + validate private key
        env:
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_SIT }}
        run: python - <<< "$WRITE_AND_VALIDATE_KEY"

      - name: Deploy to SIT
        run: |
          snow dbt deploy supabase_sit \
            --source . \
            --default-target sit \
            --dbt-version 1.9.0 \
            --env-file-dir . \
            --temporary-connection \
            --account "${{ secrets.SNOWFLAKE_ACCOUNT }}" \
            --user "${{ secrets.SNOWFLAKE_SVC_USER_SIT }}" \
            --authenticator SNOWFLAKE_JWT \
            --private-key-file /tmp/sf_key.p8 \
            --role DBT_SIT_ROLE \
            --warehouse SUPABASE_SIT_WH \
            --database SUPABASE_SIT

      - name: Report deployed version
        run: |
          snow dbt describe supabase_sit \
            --temporary-connection \
            --account "${{ secrets.SNOWFLAKE_ACCOUNT }}" \
            --user "${{ secrets.SNOWFLAKE_SVC_USER_SIT }}" \
            --authenticator SNOWFLAKE_JWT \
            --private-key-file /tmp/sf_key.p8 \
            --role DBT_SIT_ROLE \
            --warehouse SUPABASE_SIT_WH \
            --database SUPABASE_SIT

  # ──────────────────────────────────────────────────────────────
  # DEPLOY TO UAT — requires manual approval
  # ──────────────────────────────────────────────────────────────
  deploy-uat:
    name: "Deploy → UAT"
    if: github.event_name == 'push' && github.ref == 'refs/heads/uat'
    runs-on: ubuntu-latest
    environment: uat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Snowflake CLI
        run: pip install snowflake-cli cryptography

      - name: Write + validate private key
        env:
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_UAT }}
        run: python - <<< "$WRITE_AND_VALIDATE_KEY"

      - name: Deploy to UAT
        run: |
          snow dbt deploy supabase_uat \
            --source . \
            --default-target uat \
            --dbt-version 1.9.0 \
            --env-file-dir . \
            --temporary-connection \
            --account "${{ secrets.SNOWFLAKE_ACCOUNT }}" \
            --user "${{ secrets.SNOWFLAKE_SVC_USER_UAT }}" \
            --authenticator SNOWFLAKE_JWT \
            --private-key-file /tmp/sf_key.p8 \
            --role DBT_UAT_ROLE \
            --warehouse SUPABASE_UAT_WH \
            --database SUPABASE_UAT

      - name: Report deployed version
        run: |
          snow dbt describe supabase_uat \
            --temporary-connection \
            --account "${{ secrets.SNOWFLAKE_ACCOUNT }}" \
            --user "${{ secrets.SNOWFLAKE_SVC_USER_UAT }}" \
            --authenticator SNOWFLAKE_JWT \
            --private-key-file /tmp/sf_key.p8 \
            --role DBT_UAT_ROLE \
            --warehouse SUPABASE_UAT_WH \
            --database SUPABASE_UAT

  # ──────────────────────────────────────────────────────────────
  # DEPLOY TO PROD — requires 2 manual approvals
  # ──────────────────────────────────────────────────────────────
  deploy-prod:
    name: "Deploy → PROD"
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Snowflake CLI
        run: pip install snowflake-cli cryptography

      - name: Write + validate private key
        env:
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PROD }}
        run: python - <<< "$WRITE_AND_VALIDATE_KEY"

      - name: Deploy to PROD
        run: |
          snow dbt deploy supabase_prod \
            --source . \
            --default-target prod \
            --dbt-version 1.9.0 \
            --env-file-dir . \
            --temporary-connection \
            --account "${{ secrets.SNOWFLAKE_ACCOUNT }}" \
            --user "${{ secrets.SNOWFLAKE_SVC_USER_PROD }}" \
            --authenticator SNOWFLAKE_JWT \
            --private-key-file /tmp/sf_key.p8 \
            --role DBT_PROD_ROLE \
            --warehouse SUPABASE_PROD_WH \
            --database SUPABASE_PROD

      - name: Report deployed version
        run: |
          snow dbt describe supabase_prod \
            --temporary-connection \
            --account "${{ secrets.SNOWFLAKE_ACCOUNT }}" \
            --user "${{ secrets.SNOWFLAKE_SVC_USER_PROD }}" \
            --authenticator SNOWFLAKE_JWT \
            --private-key-file /tmp/sf_key.p8 \
            --role DBT_PROD_ROLE \
            --warehouse SUPABASE_PROD_WH \
            --database SUPABASE_PROD
