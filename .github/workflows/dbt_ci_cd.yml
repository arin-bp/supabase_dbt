          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_SVC_USER_UAT }}
          SNOWFLAKE_PRIVATE_KEY_RAW: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_UAT }}
          SNOWFLAKE_ROLE: DBT_UAT_ROLE
          SNOWFLAKE_WAREHOUSE: SUPABASE_UAT_WH
          SNOWFLAKE_DATABASE: SUPABASE_UAT
          SNOWFLAKE_SCHEMA: PUBLIC
        run: |
          snow dbt deploy supabase_uat \
            --source . \
            --default-target uat \
            --dbt-version 1.9.4 \

            -x \
            --account "${{ secrets.SNOWFLAKE_ACCOUNT }}" \
            --user "${{ secrets.SNOWFLAKE_SVC_USER_UAT }}" \
            --database SUPABASE_UAT \
            --schema PUBLIC

      - name: Describe deployed project
