  # ──────────────────────────────────────────────────────────────
  # DEPLOY TO UAT (Requires approval)
  # ──────────────────────────────────────────────────────────────
  deploy-uat:
    name: "Deploy → UAT"
    if: github.event_name == 'push' && github.ref == 'refs/heads/uat'
    runs-on: ubuntu-latest
    environment: uat
    steps:
      - uses: actions/checkout@v4

      - name: Setup Snowflake CLI
        uses: snowflakedb/snowflake-actions@v3
        with:
          cli-version: "latest"

      - name: "TDD Test: Verify Connection (UAT)"
        env:
          SNOWFLAKE_AUTHENTICATOR: SNOWFLAKE_JWT
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_SVC_USER_UAT }}
          SNOWFLAKE_PRIVATE_KEY_RAW: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_UAT }}
          SNOWFLAKE_ROLE: DBT_UAT_ROLE
