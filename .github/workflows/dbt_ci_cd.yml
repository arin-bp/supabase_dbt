name: dbt CI/CD — Snowflake Native

on:
  push:
    branches: [dev, sit, uat, main]
  pull_request:
    branches: [dev, sit, uat, main]

# Prevent concurrent deploys to the same environment
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # ──────────────────────────────────────────────────────────────
  # PR VALIDATION — ephemeral compile check
  # ──────────────────────────────────────────────────────────────
  pr-validate:
    name: "PR Validation — dbt compile"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Snowflake CLI
        run: pip install snowflake-cli

      - name: Write private key (TDD — validate before deploy)
        env:
          SNOWFLAKE_KEY_B64: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_DEV }}
        run: |
          printf '%s' "$SNOWFLAKE_KEY_B64" | base64 -d > /tmp/sf_key.p8
          chmod 600 /tmp/sf_key.p8
          # Fail fast: validate key is readable PKCS8 before attempting any Snowflake call
          python -c "
          from cryptography.hazmat.primitives.serialization import load_pem_private_key
          with open('/tmp/sf_key.p8','rb') as f: d = f.read()
          k = load_pem_private_key(d, password=None)
          print(f'PASS: {type(k).__name__} {k.key_size}-bit')
          "

      - name: Deploy ephemeral CI project
        run: |
          snow dbt deploy supabase_ci_pr_${{ github.run_id }} \
            --source . \
            --default-target dev \
            --dbt-version 1.9.0 \
            --env-file-dir . \
            --temporary-connection \
            --account "${{ secrets.SNOWFLAKE_ACCOUNT }}" \
            --user "${{ secrets.SNOWFLAKE_SVC_USER_DEV }}" \
            --authenticator SNOWFLAKE_JWT \
            --private-key-file /tmp/sf_key.p8 \
            --role DBT_DEV_ROLE \
            --warehouse SUPABASE_DEV_WH \
            --database SUPABASE_DEV

      - name: dbt compile (syntax + Jinja check)
        run: |
          snow dbt execute supabase_ci_pr_${{ github.run_id }} \
            --command "dbt compile --target dev" \
            --temporary-connection \
            --account "${{ secrets.SNOWFLAKE_ACCOUNT }}" \
            --user "${{ secrets.SNOWFLAKE_SVC_USER_DEV }}" \
            --authenticator SNOWFLAKE_JWT \
            --private-key-file /tmp/sf_key.p8 \
            --role DBT_DEV_ROLE \
            --warehouse SUPABASE_DEV_WH \
            --database SUPABASE_DEV

      - name: Cleanup ephemeral project object
        if: always()
        run: |
          snow dbt drop supabase_ci_pr_${{ github.run_id }} \
            --temporary-connection \
            --account "${{ secrets.SNOWFLAKE_ACCOUNT }}" \
            --user "${{ secrets.SNOWFLAKE_SVC_USER_DEV }}" \
            --authenticator SNOWFLAKE_JWT \
            --private-key-file /tmp/sf_key.p8 \
            --role DBT_DEV_ROLE \
            --warehouse SUPABASE_DEV_WH \
            --database SUPABASE_DEV || true

  # ──────────────────────────────────────────────────────────────
  # DEPLOY TO DEV
  # ──────────────────────────────────────────────────────────────
  deploy-dev:
    name: "Deploy → DEV"
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Snowflake CLI
        run: pip install snowflake-cli

      - name: Write + validate private key
        env:
          SNOWFLAKE_KEY_B64: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_DEV }}
        run: |
          printf '%s' "$SNOWFLAKE_KEY_B64" | base64 -d > /tmp/sf_key.p8
          chmod 600 /tmp/sf_key.p8
          python -c "
          from cryptography.hazmat.primitives.serialization import load_pem_private_key
          with open('/tmp/sf_key.p8','rb') as f: d = f.read()
          k = load_pem_private_key(d, password=None)
          print(f'PASS: {type(k).__name__} {k.key_size}-bit')
          "

      - name: Deploy to DEV
        run: |
          snow dbt deploy supabase_dev \
            --source . \
            --default-target dev \
            --dbt-version 1.9.0 \
            --env-file-dir . \
            --temporary-connection \
            --account "${{ secrets.SNOWFLAKE_ACCOUNT }}" \
            --user "${{ secrets.SNOWFLAKE_SVC_USER_DEV }}" \
            --authenticator SNOWFLAKE_JWT \
            --private-key-file /tmp/sf_key.p8 \
            --role DBT_DEV_ROLE \
            --warehouse SUPABASE_DEV_WH \
            --database SUPABASE_DEV

      - name: Report deployed version
        run: |
          snow dbt describe supabase_dev \
            --temporary-connection \
            --account "${{ secrets.SNOWFLAKE_ACCOUNT }}" \
            --user "${{ secrets.SNOWFLAKE_SVC_USER_DEV }}" \
            --authenticator SNOWFLAKE_JWT \
            --private-key-file /tmp/sf_key.p8 \
            --role DBT_DEV_ROLE \
            --warehouse SUPABASE_DEV_WH \
            --database SUPABASE_DEV

  # ──────────────────────────────────────────────────────────────
  # DEPLOY TO SIT
  # ──────────────────────────────────────────────────────────────
  deploy-sit:
    name: "Deploy → SIT"
    if: github.event_name == 'push' && github.ref == 'refs/heads/sit'
    runs-on: ubuntu-latest
    environment: sit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Snowflake CLI
        run: pip install snowflake-cli

      - name: Write + validate private key
        env:
          SNOWFLAKE_KEY_B64: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_SIT }}
        run: |
          printf '%s' "$SNOWFLAKE_KEY_B64" | base64 -d > /tmp/sf_key.p8
          chmod 600 /tmp/sf_key.p8
          python -c "
          from cryptography.hazmat.primitives.serialization import load_pem_private_key
          with open('/tmp/sf_key.p8','rb') as f: d = f.read()
          k = load_pem_private_key(d, password=None)
          print(f'PASS: {type(k).__name__} {k.key_size}-bit')
          "

      - name: Deploy to SIT
        run: |
          snow dbt deploy supabase_sit \
            --source . \
            --default-target sit \
            --dbt-version 1.9.0 \
            --env-file-dir . \
            --temporary-connection \
            --account "${{ secrets.SNOWFLAKE_ACCOUNT }}" \
            --user "${{ secrets.SNOWFLAKE_SVC_USER_SIT }}" \
            --authenticator SNOWFLAKE_JWT \
            --private-key-file /tmp/sf_key.p8 \
            --role DBT_SIT_ROLE \
            --warehouse SUPABASE_SIT_WH \
            --database SUPABASE_SIT

      - name: Report deployed version
        run: |
          snow dbt describe supabase_sit \
            --temporary-connection \
            --account "${{ secrets.SNOWFLAKE_ACCOUNT }}" \
            --user "${{ secrets.SNOWFLAKE_SVC_USER_SIT }}" \
            --authenticator SNOWFLAKE_JWT \
            --private-key-file /tmp/sf_key.p8 \
            --role DBT_SIT_ROLE \
            --warehouse SUPABASE_SIT_WH \
            --database SUPABASE_SIT

  # ──────────────────────────────────────────────────────────────
  # DEPLOY TO UAT — requires manual approval
  # ──────────────────────────────────────────────────────────────
  deploy-uat:
    name: "Deploy → UAT"
    if: github.event_name == 'push' && github.ref == 'refs/heads/uat'
    runs-on: ubuntu-latest
    environment: uat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Snowflake CLI
        run: pip install snowflake-cli

      - name: Write + validate private key
        env:
          SNOWFLAKE_KEY_B64: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_UAT }}
        run: |
          printf '%s' "$SNOWFLAKE_KEY_B64" | base64 -d > /tmp/sf_key.p8
          chmod 600 /tmp/sf_key.p8
          python -c "
          from cryptography.hazmat.primitives.serialization import load_pem_private_key
          with open('/tmp/sf_key.p8','rb') as f: d = f.read()
          k = load_pem_private_key(d, password=None)
          print(f'PASS: {type(k).__name__} {k.key_size}-bit')
          "

      - name: Deploy to UAT
        run: |
          snow dbt deploy supabase_uat \
            --source . \
            --default-target uat \
            --dbt-version 1.9.0 \
            --env-file-dir . \
            --temporary-connection \
            --account "${{ secrets.SNOWFLAKE_ACCOUNT }}" \
            --user "${{ secrets.SNOWFLAKE_SVC_USER_UAT }}" \
            --authenticator SNOWFLAKE_JWT \
            --private-key-file /tmp/sf_key.p8 \
            --role DBT_UAT_ROLE \
            --warehouse SUPABASE_UAT_WH \
            --database SUPABASE_UAT

      - name: Report deployed version
        run: |
          snow dbt describe supabase_uat \
            --temporary-connection \
            --account "${{ secrets.SNOWFLAKE_ACCOUNT }}" \
            --user "${{ secrets.SNOWFLAKE_SVC_USER_UAT }}" \
            --authenticator SNOWFLAKE_JWT \
            --private-key-file /tmp/sf_key.p8 \
            --role DBT_UAT_ROLE \
            --warehouse SUPABASE_UAT_WH \
            --database SUPABASE_UAT

  # ──────────────────────────────────────────────────────────────
  # DEPLOY TO PROD — requires 2 manual approvals
  # ──────────────────────────────────────────────────────────────
  deploy-prod:
    name: "Deploy → PROD"
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Snowflake CLI
        run: pip install snowflake-cli

      - name: Write + validate private key
        env:
          SNOWFLAKE_KEY_B64: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PROD }}
        run: |
          printf '%s' "$SNOWFLAKE_KEY_B64" | base64 -d > /tmp/sf_key.p8
          chmod 600 /tmp/sf_key.p8
          python -c "
          from cryptography.hazmat.primitives.serialization import load_pem_private_key
          with open('/tmp/sf_key.p8','rb') as f: d = f.read()
          k = load_pem_private_key(d, password=None)
          print(f'PASS: {type(k).__name__} {k.key_size}-bit')
          "

      - name: Deploy to PROD
        run: |
          snow dbt deploy supabase_prod \
            --source . \
            --default-target prod \
            --dbt-version 1.9.0 \
            --env-file-dir . \
            --temporary-connection \
            --account "${{ secrets.SNOWFLAKE_ACCOUNT }}" \
            --user "${{ secrets.SNOWFLAKE_SVC_USER_PROD }}" \
            --authenticator SNOWFLAKE_JWT \
            --private-key-file /tmp/sf_key.p8 \
            --role DBT_PROD_ROLE \
            --warehouse SUPABASE_PROD_WH \
            --database SUPABASE_PROD

      - name: Report deployed version
        run: |
          snow dbt describe supabase_prod \
            --temporary-connection \
            --account "${{ secrets.SNOWFLAKE_ACCOUNT }}" \
            --user "${{ secrets.SNOWFLAKE_SVC_USER_PROD }}" \
            --authenticator SNOWFLAKE_JWT \
            --private-key-file /tmp/sf_key.p8 \
            --role DBT_PROD_ROLE \
            --warehouse SUPABASE_PROD_WH \
            --database SUPABASE_PROD
