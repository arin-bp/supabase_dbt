name: dbt CI/CD — Snowflake Native

on:
  push:
    branches: [dev, sit, uat, main]
  pull_request:
    branches: [dev, sit, uat, main]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  pr-validate:
    name: "PR Validation — dbt deps + parse + compile"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt-snowflake
        run: pip install dbt-snowflake==1.9.0

      - name: Write RSA Private Key
        run: |
          printf '%s' "${{ secrets.SNOWFLAKE_PRIVATE_KEY_DEV }}" | tr -d '\r' > /tmp/sf_key.p8
          chmod 600 /tmp/sf_key.p8

      - name: Configure dbt profiles.yml
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << 'EOF'
          supabase_dbt:
            target: dev
            outputs:
              dev:
                type: snowflake
                account: "${{ secrets.SNOWFLAKE_ACCOUNT }}"
                user: "SVC_DBT_DEV"
                private_key_path: "/tmp/sf_key.p8"
                role: "DBT_DEV_ROLE"
                warehouse: "SUPABASE_DEV_WH"
                database: "SUPABASE_DEV"
                schema: "PUBLIC"
                threads: 4
          EOF

      - name: 1. Verify Packages (dbt deps)
        run: dbt deps

      - name: 2. Verify Syntax, Jinja, DAG & ref() (dbt parse)
        run: dbt parse

      - name: 3. Verify Model SQL Compilation (dbt compile)
        run: dbt compile --target dev

  deploy-dev:
    name: "Deploy -> DEV"
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - uses: snowflakedb/snowflake-actions@v3
        with:
          cli-version: "latest"

      - run: |
          printf '%s' "${{ secrets.SNOWFLAKE_PRIVATE_KEY_DEV }}" | tr -d '\r' > /tmp/sf_key.p8
          chmod 600 /tmp/sf_key.p8

      - run: |
          snow connection add \
            --connection-name default \
            --default \
            --no-interactive \
            --account "${{ secrets.SNOWFLAKE_ACCOUNT }}" \
            --user "SVC_DBT_DEV" \
            --authenticator SNOWFLAKE_JWT \
            --private-key-path /tmp/sf_key.p8 \
            --role DBT_DEV_ROLE \
            --warehouse SUPABASE_DEV_WH \
            --database SUPABASE_DEV \
            --schema PUBLIC

      - run: snow connection test

      - run: |
          snow dbt deploy supabase_dev \
            --source . \
            --default-target dev \
            --dbt-version 1.9.4

      - run: snow dbt describe supabase_dev

  deploy-sit:
    name: "Deploy -> SIT"
    if: github.event_name == 'push' && github.ref == 'refs/heads/sit'
    runs-on: ubuntu-latest
    environment: sit
    steps:
      - uses: actions/checkout@v4

      - uses: snowflakedb/snowflake-actions@v3
        with:
          cli-version: "latest"

      - run: |
          printf '%s' "${{ secrets.SNOWFLAKE_PRIVATE_KEY_SIT }}" | tr -d '\r' > /tmp/sf_key.p8
          chmod 600 /tmp/sf_key.p8

      - run: |
          snow connection add \
            --connection-name default \
            --default \
            --no-interactive \
            --account "${{ secrets.SNOWFLAKE_ACCOUNT }}" \
            --user "SVC_DBT_SIT" \
            --authenticator SNOWFLAKE_JWT \
            --private-key-path /tmp/sf_key.p8 \
            --role DBT_SIT_ROLE \
            --warehouse SUPABASE_SIT_WH \
            --database SUPABASE_SIT \
            --schema PUBLIC

      - run: snow connection test

      - run: |
          snow dbt deploy supabase_sit \
            --source . \
            --default-target sit \
            --dbt-version 1.9.4

      - run: snow dbt describe supabase_sit

  deploy-uat:
    name: "Deploy -> UAT"
    if: github.event_name == 'push' && github.ref == 'refs/heads/uat'
    runs-on: ubuntu-latest
    environment: uat
    steps:
      - uses: actions/checkout@v4

      - uses: snowflakedb/snowflake-actions@v3
        with:
          cli-version: "latest"

      - run: |
          printf '%s' "${{ secrets.SNOWFLAKE_PRIVATE_KEY_UAT }}" | tr -d '\r' > /tmp/sf_key.p8
          chmod 600 /tmp/sf_key.p8

      - run: |
          snow connection add \
            --connection-name default \
            --default \
            --no-interactive \
            --account "${{ secrets.SNOWFLAKE_ACCOUNT }}" \
            --user "SVC_DBT_UAT" \
            --authenticator SNOWFLAKE_JWT \
            --private-key-path /tmp/sf_key.p8 \
            --role DBT_UAT_ROLE \
            --warehouse SUPABASE_UAT_WH \
            --database SUPABASE_UAT \
            --schema PUBLIC

      - run: snow connection test

      - run: |
          snow dbt deploy supabase_uat \
            --source . \
            --default-target uat \
            --dbt-version 1.9.4

      - run: snow dbt describe supabase_uat

  deploy-prod:
    name: "Deploy -> PROD"
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - uses: snowflakedb/snowflake-actions@v3
        with:
          cli-version: "latest"

      - run: |
          printf '%s' "${{ secrets.SNOWFLAKE_PRIVATE_KEY_PROD }}" | tr -d '\r' > /tmp/sf_key.p8
          chmod 600 /tmp/sf_key.p8

      - run: |
          snow connection add \
            --connection-name default \
            --default \
            --no-interactive \
            --account "${{ secrets.SNOWFLAKE_ACCOUNT }}" \
            --user "SVC_DBT_PROD" \
            --authenticator SNOWFLAKE_JWT \
            --private-key-path /tmp/sf_key.p8 \
            --role DBT_PROD_ROLE \
            --warehouse SUPABASE_PROD_WH \
            --database SUPABASE_PROD \
            --schema PUBLIC

      - run: snow connection test

      - run: |
          snow dbt deploy supabase_prod \
            --source . \
            --default-target prod \
            --dbt-version 1.9.4

      - run: snow dbt describe supabase_prod
