name: dbt CD — Snowflake Native

on:
  push:
    branches: [dev, sit, uat, main]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # ──────────────────────────────────────────────────────────────
  # DEPLOYMENT PIPELINE (DEV / SIT / UAT / PROD)
  # Executes strictly on branch pushes (merges).
  # ──────────────────────────────────────────────────────────────
  deploy:
    name: "Deploy → ${{ matrix.env_upper }}"
    strategy:
      fail-fast: true
      matrix:
        include:
          - branch: dev
            env: dev
            env_upper: DEV
            role: DBT_DEV_ROLE
            warehouse: SUPABASE_DEV_WH
            database: SUPABASE_DEV
            user_secret: SNOWFLAKE_SVC_USER_DEV
            key_secret: SNOWFLAKE_PRIVATE_KEY_DEV

          - branch: sit
            env: sit
            env_upper: SIT
            role: DBT_SIT_ROLE
            warehouse: SUPABASE_SIT_WH
            database: SUPABASE_SIT
            user_secret: SNOWFLAKE_SVC_USER_SIT
            key_secret: SNOWFLAKE_PRIVATE_KEY_SIT

          - branch: uat
            env: uat
            env_upper: UAT
            role: DBT_UAT_ROLE
            warehouse: SUPABASE_UAT_WH
            database: SUPABASE_UAT
            user_secret: SNOWFLAKE_SVC_USER_UAT
            key_secret: SNOWFLAKE_PRIVATE_KEY_UAT

          - branch: main
            env: prod
            env_upper: PROD
            role: DBT_PROD_ROLE
            warehouse: SUPABASE_PROD_WH
            database: SUPABASE_PROD
            user_secret: SNOWFLAKE_SVC_USER_PROD
            key_secret: SNOWFLAKE_PRIVATE_KEY_PROD

    runs-on: ubuntu-latest
    environment: ${{ matrix.env }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        if: github.ref == format('refs/heads/{0}', matrix.branch)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Snowflake CLI
        if: github.ref == format('refs/heads/{0}', matrix.branch)
        uses: snowflakedb/snowflake-actions@9c1ee7cfd0bd103b41d08e530b1e42c26210f4fa # v3.2.0
        with:
          cli-version: "latest"

      - name: Write RSA Private Key
        if: github.ref == format('refs/heads/{0}', matrix.branch)
        run: |
          printf '%s' "${{ secrets[matrix.key_secret] }}" > /tmp/sf_key.p8
          chmod 600 /tmp/sf_key.p8

      - name: Configure Snowflake CLI Connection
        if: github.ref == format('refs/heads/{0}', matrix.branch)
        run: |
          snow connection add \
            --connection-name default \
            --default \
            --no-interactive \
            --account "${{ secrets.SNOWFLAKE_ACCOUNT }}" \
            --user "${{ secrets[matrix.user_secret] }}" \
            --authenticator SNOWFLAKE_JWT \
            --private-key-path /tmp/sf_key.p8 \
            --role "${{ matrix.role }}" \
            --warehouse "${{ matrix.warehouse }}" \
            --database "${{ matrix.database }}" \
            --schema PUBLIC

      - name: Verify Connection
        if: github.ref == format('refs/heads/{0}', matrix.branch)
        run: snow connection test

      - name: Deploy to ${{ matrix.env_upper }}
        if: github.ref == format('refs/heads/{0}', matrix.branch)
        run: |
          snow dbt deploy supabase_${{ matrix.env }} \
            --source . \
            --default-target ${{ matrix.env }} \
            --dbt-version 1.9.4

      - name: Describe deployed project
        if: github.ref == format('refs/heads/{0}', matrix.branch)
        run: |
          snow dbt describe supabase_${{ matrix.env }}
