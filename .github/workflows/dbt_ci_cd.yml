          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_SVC_USER_PROD }}
          SNOWFLAKE_PRIVATE_KEY_RAW: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PROD }}
          SNOWFLAKE_ROLE: DBT_PROD_ROLE
          SNOWFLAKE_WAREHOUSE: SUPABASE_PROD_WH
          SNOWFLAKE_DATABASE: SUPABASE_PROD
          SNOWFLAKE_SCHEMA: PUBLIC
        run: |
          snow dbt describe supabase_prod -x \
            --account "${{ secrets.SNOWFLAKE_ACCOUNT }}" \
            --user "${{ secrets.SNOWFLAKE_SVC_USER_PROD }}" \
            --database SUPABASE_PROD \
            --schema PUBLIC
