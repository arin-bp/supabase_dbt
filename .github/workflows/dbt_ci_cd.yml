name: dbt CI/CD — Snowflake Native

on:
  push:
    branches: [dev, sit, uat, main]
  pull_request:
    branches: [dev, sit, uat, main]

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # ──────────────────────────────────────────────────────────────
  # PR VALIDATION — TDD Smoke test & ephemeral compilation
  # ──────────────────────────────────────────────────────────────
  pr-validate:
    name: "PR Validation — dbt compile"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Snowflake CLI
        uses: snowflakedb/snowflake-actions@v3
        with:
          cli-version: "latest"

      - name: "TDD Test: Verify Snowflake Connection (DEV)"
        env:
          SNOWFLAKE_AUTHENTICATOR: SNOWFLAKE_JWT
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_SVC_USER_DEV }}
          SNOWFLAKE_PRIVATE_KEY_RAW: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_DEV }}
          SNOWFLAKE_ROLE: DBT_DEV_ROLE
          SNOWFLAKE_WAREHOUSE: SUPABASE_DEV_WH
          SNOWFLAKE_DATABASE: SUPABASE_DEV
          SNOWFLAKE_SCHEMA: PUBLIC
        run: |
          snow connection test -x \
            --account "${{ secrets.SNOWFLAKE_ACCOUNT }}" \
            --user "${{ secrets.SNOWFLAKE_SVC_USER_DEV }}" \
            --database SUPABASE_DEV \
            --schema PUBLIC

      - name: Deploy ephemeral CI project
        env:
          SNOWFLAKE_AUTHENTICATOR: SNOWFLAKE_JWT
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_SVC_USER_DEV }}
          SNOWFLAKE_PRIVATE_KEY_RAW: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_DEV }}
          SNOWFLAKE_ROLE: DBT_DEV_ROLE
          SNOWFLAKE_WAREHOUSE: SUPABASE_DEV_WH
          SNOWFLAKE_DATABASE: SUPABASE_DEV
          SNOWFLAKE_SCHEMA: PUBLIC
        run: |
          snow dbt deploy supabase_ci_pr_${{ github.run_id }} \
            --source . \
            --default-target dev \
            --dbt-version 1.9.4 \

            -x \
            --account "${{ secrets.SNOWFLAKE_ACCOUNT }}" \
            --user "${{ secrets.SNOWFLAKE_SVC_USER_DEV }}" \
            --database SUPABASE_DEV \
            --schema PUBLIC

      - name: Execute dbt compile
        env:
          SNOWFLAKE_AUTHENTICATOR: SNOWFLAKE_JWT
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_SVC_USER_DEV }}
          SNOWFLAKE_PRIVATE_KEY_RAW: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_DEV }}
          SNOWFLAKE_ROLE: DBT_DEV_ROLE
          SNOWFLAKE_WAREHOUSE: SUPABASE_DEV_WH
          SNOWFLAKE_DATABASE: SUPABASE_DEV
          SNOWFLAKE_SCHEMA: PUBLIC
        run: |
          snow dbt execute supabase_ci_pr_${{ github.run_id }} \
            --command "dbt compile --target dev" \
            -x \
            --account "${{ secrets.SNOWFLAKE_ACCOUNT }}" \
            --user "${{ secrets.SNOWFLAKE_SVC_USER_DEV }}" \
            --database SUPABASE_DEV \
            --schema PUBLIC

      - name: Cleanup ephemeral project
        if: always()
        env:
          SNOWFLAKE_AUTHENTICATOR: SNOWFLAKE_JWT
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_SVC_USER_DEV }}
          SNOWFLAKE_PRIVATE_KEY_RAW: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_DEV }}
          SNOWFLAKE_ROLE: DBT_DEV_ROLE
          SNOWFLAKE_WAREHOUSE: SUPABASE_DEV_WH
          SNOWFLAKE_DATABASE: SUPABASE_DEV
          SNOWFLAKE_SCHEMA: PUBLIC
        run: |
          snow dbt drop supabase_ci_pr_${{ github.run_id }} -x \
            --account "${{ secrets.SNOWFLAKE_ACCOUNT }}" \
            --user "${{ secrets.SNOWFLAKE_SVC_USER_DEV }}" \
            --database SUPABASE_DEV \
            --schema PUBLIC || true

  # ──────────────────────────────────────────────────────────────
  # DEPLOY TO DEV
  # ──────────────────────────────────────────────────────────────
  deploy-dev:
    name: "Deploy → DEV"
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Setup Snowflake CLI
        uses: snowflakedb/snowflake-actions@v3
        with:
          cli-version: "latest"

      - name: "TDD Test: Verify Connection (DEV)"
        env:
          SNOWFLAKE_AUTHENTICATOR: SNOWFLAKE_JWT
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_SVC_USER_DEV }}
          SNOWFLAKE_PRIVATE_KEY_RAW: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_DEV }}
          SNOWFLAKE_ROLE: DBT_DEV_ROLE
          SNOWFLAKE_WAREHOUSE: SUPABASE_DEV_WH
          SNOWFLAKE_DATABASE: SUPABASE_DEV
          SNOWFLAKE_SCHEMA: PUBLIC
        run: |
          snow connection test -x \
            --account "${{ secrets.SNOWFLAKE_ACCOUNT }}" \
            --user "${{ secrets.SNOWFLAKE_SVC_USER_DEV }}" \
            --database SUPABASE_DEV \
            --schema PUBLIC

      - name: Deploy to DEV
        env:
          SNOWFLAKE_AUTHENTICATOR: SNOWFLAKE_JWT
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_SVC_USER_DEV }}
          SNOWFLAKE_PRIVATE_KEY_RAW: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_DEV }}
          SNOWFLAKE_ROLE: DBT_DEV_ROLE
          SNOWFLAKE_WAREHOUSE: SUPABASE_DEV_WH
          SNOWFLAKE_DATABASE: SUPABASE_DEV
          SNOWFLAKE_SCHEMA: PUBLIC
        run: |
          snow dbt deploy supabase_dev \
            --source . \
            --default-target dev \
            --dbt-version 1.9.4 \

            -x \
            --account "${{ secrets.SNOWFLAKE_ACCOUNT }}" \
            --user "${{ secrets.SNOWFLAKE_SVC_USER_DEV }}" \
            --database SUPABASE_DEV \
            --schema PUBLIC

      - name: Describe deployed project
        env:
          SNOWFLAKE_AUTHENTICATOR: SNOWFLAKE_JWT
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_SVC_USER_DEV }}
          SNOWFLAKE_PRIVATE_KEY_RAW: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_DEV }}
          SNOWFLAKE_ROLE: DBT_DEV_ROLE
          SNOWFLAKE_WAREHOUSE: SUPABASE_DEV_WH
          SNOWFLAKE_DATABASE: SUPABASE_DEV
          SNOWFLAKE_SCHEMA: PUBLIC
        run: |
          snow dbt describe supabase_dev -x \
            --account "${{ secrets.SNOWFLAKE_ACCOUNT }}" \
            --user "${{ secrets.SNOWFLAKE_SVC_USER_DEV }}" \
            --database SUPABASE_DEV \
            --schema PUBLIC

  # ──────────────────────────────────────────────────────────────
  # DEPLOY TO SIT
  # ──────────────────────────────────────────────────────────────
  deploy-sit:
    name: "Deploy → SIT"
    if: github.event_name == 'push' && github.ref == 'refs/heads/sit'
    runs-on: ubuntu-latest
    environment: sit
    steps:
      - uses: actions/checkout@v4

      - name: Setup Snowflake CLI
        uses: snowflakedb/snowflake-actions@v3
        with:
          cli-version: "latest"

      - name: "TDD Test: Verify Connection (SIT)"
        env:
          SNOWFLAKE_AUTHENTICATOR: SNOWFLAKE_JWT
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_SVC_USER_SIT }}
          SNOWFLAKE_PRIVATE_KEY_RAW: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_SIT }}
          SNOWFLAKE_ROLE: DBT_SIT_ROLE
          SNOWFLAKE_WAREHOUSE: SUPABASE_SIT_WH
          SNOWFLAKE_DATABASE: SUPABASE_SIT
          SNOWFLAKE_SCHEMA: PUBLIC
        run: |
          snow connection test -x \
            --account "${{ secrets.SNOWFLAKE_ACCOUNT }}" \
            --user "${{ secrets.SNOWFLAKE_SVC_USER_SIT }}" \
            --database SUPABASE_SIT \
            --schema PUBLIC

      - name: Deploy to SIT
        env:
          SNOWFLAKE_AUTHENTICATOR: SNOWFLAKE_JWT
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_SVC_USER_SIT }}
          SNOWFLAKE_PRIVATE_KEY_RAW: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_SIT }}
          SNOWFLAKE_ROLE: DBT_SIT_ROLE
          SNOWFLAKE_WAREHOUSE: SUPABASE_SIT_WH
          SNOWFLAKE_DATABASE: SUPABASE_SIT
          SNOWFLAKE_SCHEMA: PUBLIC
        run: |
          snow dbt deploy supabase_sit \
            --source . \
            --default-target sit \
            --dbt-version 1.9.4 \

            -x \
            --account "${{ secrets.SNOWFLAKE_ACCOUNT }}" \
            --user "${{ secrets.SNOWFLAKE_SVC_USER_SIT }}" \
            --database SUPABASE_SIT \
            --schema PUBLIC

      - name: Describe deployed project
        env:
          SNOWFLAKE_AUTHENTICATOR: SNOWFLAKE_JWT
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_SVC_USER_SIT }}
          SNOWFLAKE_PRIVATE_KEY_RAW: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_SIT }}
          SNOWFLAKE_ROLE: DBT_SIT_ROLE
          SNOWFLAKE_WAREHOUSE: SUPABASE_SIT_WH
          SNOWFLAKE_DATABASE: SUPABASE_SIT
          SNOWFLAKE_SCHEMA: PUBLIC
        run: |
          snow dbt describe supabase_sit -x \
            --account "${{ secrets.SNOWFLAKE_ACCOUNT }}" \
            --user "${{ secrets.SNOWFLAKE_SVC_USER_SIT }}" \
