  # ──────────────────────────────────────────────────────────────
  # DEPLOY TO PROD (Requires approvals)
  # ──────────────────────────────────────────────────────────────
  deploy-prod:
    name: "Deploy → PROD"
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - name: Setup Snowflake CLI
        uses: snowflakedb/snowflake-actions@v3
