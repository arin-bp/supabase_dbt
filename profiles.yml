snowflake_profile:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', 'dummy_account') }}"
      user: "{{ env_var('SNOWFLAKE_USER', 'SVC_DBT_DEV') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH', '/tmp/sf_key.p8') }}"
      database: SUPABASE_DEV
      role: DBT_DEV_ROLE
      schema: PUBLIC
      warehouse: SUPABASE_DEV_WH
      threads: 4

    sit:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', 'dummy_account') }}"
      user: "{{ env_var('SNOWFLAKE_USER', 'SVC_DBT_SIT') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH', '/tmp/sf_key.p8') }}"
      database: SUPABASE_SIT
      role: DBT_SIT_ROLE
      schema: PUBLIC
      warehouse: SUPABASE_SIT_WH
      threads: 4

    uat:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', 'dummy_account') }}"
      user: "{{ env_var('SNOWFLAKE_USER', 'SVC_DBT_UAT') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH', '/tmp/sf_key.p8') }}"
      database: SUPABASE_UAT
      role: DBT_UAT_ROLE
      schema: PUBLIC
      warehouse: SUPABASE_UAT_WH
      threads: 4

    prod:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', 'dummy_account') }}"
      user: "{{ env_var('SNOWFLAKE_USER', 'SVC_DBT_PROD') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH', '/tmp/sf_key.p8') }}"
      database: SUPABASE_PROD
      role: DBT_PROD_ROLE
      schema: PUBLIC
      warehouse: SUPABASE_PROD_WH
      threads: 8
