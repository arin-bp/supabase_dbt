# env.yml — Snowflake CLI 3.21+ feature
# Snowflake reads this file during `snow dbt execute` and injects the
# correct env vars based on the active environment (dev/sit/uat/prod).
# This means the CI pipeline doesn't need to manually set these — Snowflake handles it.
#
# Reference: https://docs.snowflake.com/en/developer-guide/snowflake-cli/dbt/overview

environments:
  dev:
    SNOWFLAKE_TARGET_DATABASE: SUPABASE_DEV
    SNOWFLAKE_SOURCE_DATABASE: SOLVEFINS_DATA_V2
    DBT_SOURCE_TABLE: ECOM_TABLE
    DBT_TARGET_TABLE: ecom_target

  sit:
    SNOWFLAKE_TARGET_DATABASE: SUPABASE_SIT
    SNOWFLAKE_SOURCE_DATABASE: SOLVEFINS_DATA_V2
    DBT_SOURCE_TABLE: ECOM_TABLE
    DBT_TARGET_TABLE: ecom_target

  uat:
    SNOWFLAKE_TARGET_DATABASE: SUPABASE_UAT
    SNOWFLAKE_SOURCE_DATABASE: SOLVEFINS_DATA_V2
    DBT_SOURCE_TABLE: ECOM_TABLE
    DBT_TARGET_TABLE: ecom_target

  prod:
    SNOWFLAKE_TARGET_DATABASE: SUPABASE_PROD
    SNOWFLAKE_SOURCE_DATABASE: SOLVEFINS_DATA_V2
    DBT_SOURCE_TABLE: ECOM_TABLE
    DBT_TARGET_TABLE: ecom_target
